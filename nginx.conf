server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Coolify terminates TLS at its proxy, so this speaks plain HTTP and only
    # needs to know the real scheme for correctness of any absolute URL.
    absolute_redirect off;

    # The bundle carries a content hash in its filename, so it can be cached
    # indefinitely. index.html must not be, or a deploy would never be picked
    # up by anyone who had already visited.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # All state lives in the URL fragment, which never reaches the server, so
    # this only needs to cover someone typing a stray path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip            on;
    gzip_vary       on;
    gzip_min_length 512;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    server_tokens off;
}
